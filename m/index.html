<title>メルマガ登録者さま限定｜ねこねこショップ☆</title>
<meta name="theme-color" content="#ffb3d1">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">

<style>
:root{--ink:#3d3354;--ink-soft:#6f6588;--line:#e9e1f5;--pink:#ff6fa8;--pink-d:#e84d8c;--pink-l:#ffe3ef;--lav:#9a7cff;--lav-l:#efe9ff;--sky:#3fb3f5;--sky-l:#e2f4ff;--sun:#ffc93c;--sun-l:#fff5d6;--navy:#2d2a5a;
 --shadow:0 6px 0 rgba(122,96,170,.10),0 14px 30px rgba(122,96,170,.14);--pop:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif;--round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font-family:var(--round);font-weight:500;line-height:1.8;font-size:16px;background:#dcecff;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.75) 2px,transparent 2.5px),linear-gradient(175deg,#bfe8ff 0%,#dcecff 35%,#f6e2ff 70%,#ffd9ea 100%);background-size:22px 22px,100% 100%}
img{max-width:100%;height:auto;display:block}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 40px}
.brand{font-family:var(--pop);font-size:22px;color:var(--pink-d);text-decoration:none;display:inline-block;margin-bottom:14px;text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff}
.card{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:22px}
/* 合言葉画面 */
.lock{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:center;max-width:760px;margin:6vh auto 0}
.lock h1{font-family:var(--pop);font-weight:400;font-size:24px;margin:0 0 6px;line-height:1.5}
.lock p{margin:0 0 14px;color:var(--ink-soft);font-size:15px}
.lock form{display:flex;gap:10px}
.lock input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 16px;border-radius:999px;border:2.5px solid var(--line);outline:none}
.lock input:focus{border-color:var(--pink)}
.btn{font:inherit;font-weight:800;font-size:16px;color:#fff;background:var(--pink);border:0;border-radius:999px;padding:12px 26px;box-shadow:0 5px 0 var(--pink-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink-d)}
.err{color:#d23c6e;font-weight:800;font-size:14px;min-height:1.6em;margin-top:6px}
@media (max-width:640px){.lock{grid-template-columns:1fr;gap:10px;margin-top:2vh}.lock .pic{max-width:160px;margin:0 auto}.lock h1{font-size:20px;text-align:center}.lock p{text-align:center}}
/* キャンペーン本文（暗号化された中身で使う部品） */
.hero{display:grid;grid-template-columns:1fr 200px;gap:18px;align-items:center;background:var(--pink-l);border:3px solid #fff}
.hero .tag{display:inline-block;background:var(--pink);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:2px 14px}
.hero h1{font-family:var(--pop);font-weight:400;font-size:clamp(26px,5vw,42px);line-height:1.35;margin:8px 0;color:var(--pink-d)}
.hero .period{font-weight:800;font-size:17px}
.hero .plus{display:inline-block;background:#fff;border-radius:16px;padding:6px 16px 6px 8px;line-height:1.6;margin:2px 0 10px;font-weight:800;font-size:16px}
.hero .plus b{color:var(--pink-d);font-weight:800;white-space:nowrap}
.hero .plus .tl{display:inline-grid;vertical-align:middle;margin-right:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.h{font-family:var(--pop);font-weight:400;font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.h .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--navy);display:grid;place-items:center;font-size:15px}
/* 商品カード（絵で枚数を見せる） */
.tiles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tl{width:36px;height:48px;border-radius:7px;display:grid;place-items:center;color:#fff;font-family:var(--pop);font-weight:400;font-size:14px;border:2px solid #fff;box-shadow:0 3px 0 rgba(45,42,90,.10);flex:none}
.tl.B{background:#9aa3b8}.tl.A{background:#5fb7f0}.tl.S{background:#a77cf0}.tl.SS{background:linear-gradient(135deg,#ff6fa8,#ffb340);font-size:12px}
.tl.gift{background:linear-gradient(90deg,transparent 43%,#ffd23f 43% 57%,transparent 57%),linear-gradient(transparent 38%,#ffd23f 38% 52%,transparent 52%),#ff6fa8;animation:pop .5s ease-out both}
.tl.new{animation:pop .4s ease-out both}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.rk{display:inline-grid;place-items:center;min-width:40px;height:32px;padding:0 10px;border-radius:999px;color:#fff;font-family:var(--pop);font-weight:400;font-size:15px;vertical-align:middle}
.rk.B{background:#9aa3b8}.rk.A{background:#5fb7f0}.rk.S{background:#a77cf0}.rk.SS{background:linear-gradient(135deg,#ff6fa8,#ffb340)}
.gift{color:var(--pink-d)}
.big{font-family:var(--pop);font-weight:400;line-height:1.45}
/* いつも vs いまだけ */
.cmp{display:grid;gap:12px}
.cmp .ln{display:grid;grid-template-columns:84px 1fr auto;gap:12px;align-items:center;background:#f6f3fb;border-radius:16px;padding:12px 14px}
.cmp .ln.now{background:var(--pink-l);position:relative}
.cmp .ln b{font-family:var(--pop);font-weight:400;font-size:17px;line-height:1.4}
.cmp .ln.now b{color:var(--pink-d)}
.cmp .ln .to{display:flex;align-items:center;gap:6px;font-weight:800;font-size:20px;color:var(--pink)}
.stamp{position:absolute;right:-6px;top:-14px;background:var(--sun);color:var(--navy);font-family:var(--pop);font-size:16px;border-radius:999px;padding:2px 14px;transform:rotate(6deg);border:3px solid #fff}
/* シミュレーター */
.sim .pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sim .pick button{font:inherit;font-weight:800;font-size:16px;border-radius:999px;border:2.5px solid var(--line);background:#fff;color:var(--ink);padding:7px 18px;cursor:pointer}
.sim .pick button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sim .pick.cnt button.on{background:var(--pink);border-color:var(--pink)}
.sim .stage{background:#f9f7fd;border-radius:18px;padding:14px;display:grid;gap:10px;margin-top:4px}
.sim .lab{font-weight:800;font-size:14px;color:var(--ink-soft)}
.sim .down{text-align:center;font-size:26px;line-height:1;color:var(--pink)}
.sim .msg{text-align:center;font-size:clamp(20px,3.4vw,26px);margin-top:4px}
.sim .msg small{display:block;font-family:var(--round);font-size:15px;font-weight:800;color:var(--ink-soft)}
/* ランクの説明 */
.ladder{display:flex;align-items:flex-end;gap:8px;justify-content:center;margin:6px 0 10px}
.ladder div{text-align:center;font-weight:800;font-size:13px;color:var(--ink-soft)}
.ladder .rk{display:grid;margin:0 auto 4px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-weight:800}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-size:14px;margin-top:2px}
.steps small{display:block;font-weight:500;color:var(--ink-soft);font-size:14px}
.kw{display:inline-block;background:var(--sun-l);border:2px dashed var(--sun);border-radius:10px;padding:0 10px;font-family:var(--pop);font-weight:400}
details.note{margin-top:18px}
details.note summary{cursor:pointer;font-family:var(--pop);font-size:17px;list-style:none}
details.note summary::after{content:"＋";float:right;color:var(--pink)}
details.note[open] summary::after{content:"−"}
details.note ul{margin:12px 0 0;padding-left:1.3em;font-size:15px}
.ended{background:#3d3354;color:#fff;border-radius:16px;padding:12px 18px;font-weight:800;margin-bottom:16px;text-align:center}
.foot{text-align:center;margin-top:26px;font-size:14px;color:var(--ink-soft)}
.foot a{color:var(--pink-d);font-weight:800}
@media (max-width:760px){.sim .pick{gap:6px}.sim .pick button{padding:6px 12px;font-size:15px}.hero{grid-template-columns:1fr 84px;padding:16px;gap:10px}.hero h1{font-size:22px}.hero .period{font-size:15px}.sim .msg{font-size:18px}.grid{grid-template-columns:1fr}.tl{width:30px;height:40px;font-size:12px}.tl.SS{font-size:10px}.cmp .ln{grid-template-columns:1fr auto}.cmp .ln b{grid-column:1/-1}}
</style>
</head>

  function norm(s) {
    return s.normalize('NFKC').replace(/\s+/g, '').toLowerCase()
      .replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); });
  }
  async function decrypt(word) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(word)), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
    return new TextDecoder().decode(plain);
  }
  function setupSims(root) {
    function tiles(n, cls) { var h = ''; for (var i = 0; i < n; i++) h += '<span class="tl ' + cls + '" style="animation-delay:' + (i * 30) + 'ms">' + (cls.indexOf('gift') < 0 ? cls.split(' ')[0] : '') + '</span>'; return h; }
    root.querySelectorAll('[data-tiles]').forEach(function (el) { var t = el.dataset.tiles.split(':'); el.insertAdjacentHTML('afterbegin', tiles(+t[0], t[1])); });
    // data-step 枚で1ランクアップ、それをこえたら data-step 枚ごとにおまけ1枚。data-map は「元>後」
    root.querySelectorAll('.sim').forEach(function (sim) {
      var step = +sim.dataset.step, max = +(sim.dataset.max || 20), map = sim.dataset.map.split(',').map(function (m) { return m.split('>'); });
      var st = { r: 0, n: step };
      var h = '<div class="pick rank">' + map.map(function (r, i) { return '<button type="button" data-r="' + i + '"><span class="rk ' + r[0] + '">' + r[0] + '</span> の商品</button>'; }).join('') + '</div><div class="pick cnt">';
      for (var n = step; n <= max; n += step) h += '<button type="button" data-n="' + n + '">' + n + '枚</button>';
      sim.querySelector('.ctl').innerHTML = h + '</div>';
      function show() {
        var r = map[st.r], gift = Math.floor(st.n / step) - 1;
        sim.querySelectorAll('[data-r]').forEach(function (b) { b.classList.toggle('on', +b.dataset.r === st.r); });
        sim.querySelectorAll('[data-n]').forEach(function (b) { b.classList.toggle('on', +b.dataset.n === st.n); });
        sim.querySelector('.stage').innerHTML =
          '<div class="lab">まとめて落札すると…</div><div class="tiles">' + tiles(st.n, r[0]) + '</div>' +
          '<div class="down">▼</div><div class="lab">とどくのは…</div><div class="tiles">' + tiles(st.n, r[1] + ' new') + tiles(gift, 'gift') + '</div>' +
          '<div class="msg big">ぜんぶ <span class="rk ' + r[1] + '">' + r[1] + '</span> になる！' +
          (gift > 0 ? '<br><span class="gift">さらに おまけ ' + gift + '枚 プレゼント！</span>' : '') +
          (st.n === max ? '<small>1回で届くのは、これがいちばん多い ' + (st.n + gift) + '枚です</small>' : '') + '</div>';
      }
      sim.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.dataset.r) st.r = +b.dataset.r; if (b.dataset.n) st.n = +b.dataset.n; show();
      });
      show();
    });
    var c = root.querySelector('[data-until]');
    if (c) {
      var now = new Date(), t = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);
      if (t > c.dataset.until) c.insertAdjacentHTML('afterbegin', '<div class="ended">このキャンペーンは終了しました。次回をお楽しみに</div>');
    }
  }
  async function open(word, quiet) {
    try {
      var html = await decrypt(word);
      var box = document.getElementById('content');
      box.innerHTML = html; box.hidden = false;
      document.getElementById('lockview').hidden = true;
      setupSims(box);
      try { localStorage.setItem(STORE, word); } catch (e) {}
      if (typeof gtag === 'function') gtag('event', 'mail_unlock', { campaign: P.id });
    } catch (e) {
      if (!quiet) document.getElementById('err').textContent = '合言葉が違うようです。メールの合言葉をもう一度ご確認ください。';
    }
  }
  document.getElementById('unlock').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var w = document.getElementById('kw').value;
    if (!w.trim()) { document.getElementById('err').textContent = '合言葉を入れてください。'; return; }
    open(w);
  });
  document.getElementById('kw').addEventListener('input', function () { document.getElementById('err').textContent = ''; });
  try { var saved = localStorage.getItem(STORE); if (saved) open(saved, true); } catch (e) {}
})();
</script>
